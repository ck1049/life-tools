server:
  port: 8085
  servlet:
    context-path: /auth
spring:
  application:
    name: authentication
  profiles:
    active: dev
  cloud:
    nacos:
      server-addr: 127.0.0.1:18848
      username: nacos
      password: nacos
      discovery:
        namespace: life-tools
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3308/life_tools?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8
    username: root
    password: 123456
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      database: 0
mybatis:
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.loafer.auth.model
  mapper-locations: classpath:mapper/*.xml
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
security:
  authentication:
    custom: disable